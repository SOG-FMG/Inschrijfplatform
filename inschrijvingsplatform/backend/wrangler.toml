# Cloudflare Worker: API van het inschrijvingsplatform.
# Invullen bij de eerste livegang: zie Stappenplan_Livegang.md (stap 4, 9 en 12).
# Deze naam moet gelijk zijn aan de naam van de Worker in het dashboard (Workers Builds).
name = "inschrijvingsplatform-api"
main = "src/index.ts"
compatibility_date = "2026-09-30"

# Bereikbaar op https://inschrijvingsplatform-api.<account>.workers.dev
workers_dev = true
# Geen publieke preview-URL's per versie (die zouden nieuwe code met echte data blootstellen).
preview_urls = false

# Een eigen domein is niet nodig: de frontend (Worker 'fmg-inschrijfplatform') stuurt /api/* via een service binding
# door naar deze Worker, zodat alles onder één hostnaam draait (cookies, passkeys). Zie frontend/worker/index.ts.

# D1 met jurisdictie 'eu': data wordt enkel binnen de EU opgeslagen en verwerkt.
# (Een location hint zoals 'weur' is géén garantie; de jurisdictie wel.)
#   npx wrangler d1 create inschrijvingen-db --jurisdiction eu
# Vul daarna het database_id hieronder in.
[[d1_databases]]
binding = "DB"
database_name = "inschrijvingen-db"
database_id = "969a47be-e8d6-4705-807a-c34b205f90cd"
migrations_dir = "migrations"

# R2 met jurisdictie 'eu': schermafbeeldingen van meldingen ("Probleem of idee melden").
#   npx wrangler r2 bucket create inschrijvingen-bestanden --jurisdiction eu
[[r2_buckets]]
binding = "STORAGE"
bucket_name = "inschrijvingen-bestanden"
jurisdiction = "eu"

# Rate limiting per IP-adres (zonder eigen domein/WAF). 'period' is 10 of 60 seconden; namespace_id is vrij te kiezen en uniek in het account.
[[ratelimits]]
name = "RL_REGISTRATIE"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "RL_MELDING"
namespace_id = "1002"
simple = { limit = 5, period = 60 }

# Dagelijks: anonimisering na de bewaartermijn en opruimen van oude meldingen. Tijd in UTC.
[triggers]
crons = ["15 3 * * *"]

[observability]
enabled = true

# Niet-geheime instellingen. Secrets (NOOIT hier invullen) via `npx wrangler secret put <NAAM>`:
#   ENCRYPTION_KEY        64 hex-tekens; eerst in de kluis bewaren (stap 5)
#   TURNSTILE_SECRET      stap 10
#   HOOFDADMIN_SETUP_CODE 16 tekens (A-Z, 2-7); stap 13
#   MAIL_WEBHOOK_URL      webhook-adres van de Power Automate-flow; stap 14
#   MAIL_WEBHOOK_SLEUTEL  gedeeld geheim dat de flow controleert; stap 14
#   GRAPH_CLIENT_SECRET   stap 14
[vars]
# Profiel van deze installatie (src/kern/installatie.ts). Een andere organisatie krijgt een eigen installatie met eigen waarden.
ORGANISATIE_NAAM = "Stedelijk Onderwijs Gent"
# E-maildomeinen van medewerkers (komma-gescheiden). "*" = elk adres, enkel op uitnodiging. Leeg = niemand kan aanmelden.
AANMELD_DOMEINEN = "onderwijs.gent.be"
# Hoe deze organisatie wie een sessie geeft noemt (op het scherm en in mails); intern heet dat 'sessiegever'.
TERM_SESSIEGEVER = "lesgever"
TERM_SESSIEGEVERS = "lesgevers"
# Actieve modules (src/modules/index.ts), komma-gescheiden. De kern is altijd actief. Ontbreekt het: alle modules.
MODULES = "evenementen,onderwijs,rapporten,etiketten,meldingen,voorinschrijvingen,mailsjablonen"
# URL van de frontend (Cloudflare Pages), zonder slash op het einde. Meerdere origins: komma-gescheiden.
ALLOWED_ORIGINS = "https://fmg-inschrijfplatform.freinetmiddenschool-automatisatie.workers.dev"
PUBLIC_APP_URL = "https://fmg-inschrijfplatform.freinetmiddenschool-automatisatie.workers.dev"
# Hoofdadmin (stap 13): de enige die zich de eerste keer kan activeren, met het secret HOOFDADMIN_SETUP_CODE.
# Daarna voegt die de andere medewerkers toe in het beheerscherm. Enkel adressen van AANMELD_DOMEINEN.
HOOFDADMIN_EMAIL = "freinetmiddenschool.automatisatie@onderwijs.gent.be" #van FMG
# 'log' = geen mails versturen (enkel loggen). Op 'webhook' zetten in stap 14 (Power Automate-flow).
MAIL_PROVIDER = "webhook"
# GRAPH_TENANT_ID = "<tenant-id>"
# GRAPH_CLIENT_ID = "<app-registratie-client-id>"
# GRAPH_SENDER = "infodag@<school>.be"
# MELDINGEN_MAIL = "<team>@onderwijs.gent.be"   # seintje bij een nieuwe melding

# =====================================================================
# Andere installaties (Plan_Modulair_Platform.md, hoofdstuk 2). Alles hierboven is de installatie van FMG.
# Elke installatie heeft een eigen Worker, D1, R2, geheimen en waarden. Bindings en [vars] worden niet
# overgeërfd: herhaal ze volledig. Aanmaken, geheimen en bijwerken: zie installaties.ps1 in de hoofdmap.
# De Worker heet "<name>-<installatie>", bv. inschrijvingsplatform-api-test.
# =====================================================================

# ---- test: om nieuwe versies eerst na te kijken, met voorbeelddata, nooit echte gegevens ----
[env.test]
workers_dev = true
preview_urls = false

[[env.test.d1_databases]]
binding = "DB"
database_name = "inschrijvingen-db-test"
database_id = "203fb0ec-2009-49ab-90be-22c8f4788baf"
migrations_dir = "migrations"

[[env.test.r2_buckets]]
binding = "STORAGE"
bucket_name = "inschrijvingen-bestanden-test"
jurisdiction = "eu"

[[env.test.ratelimits]]
name = "RL_REGISTRATIE"
namespace_id = "1101"
simple = { limit = 10, period = 60 }

[[env.test.ratelimits]]
name = "RL_MELDING"
namespace_id = "1102"
simple = { limit = 5, period = 60 }

[env.test.triggers]
crons = ["15 3 * * *"]

[env.test.observability]
enabled = true

[env.test.vars]
ORGANISATIE_NAAM = "Testinstallatie"
AANMELD_DOMEINEN = "onderwijs.gent.be"
TERM_SESSIEGEVER = "lesgever"
TERM_SESSIEGEVERS = "lesgevers"
MODULES = "evenementen,onderwijs,rapporten,etiketten,meldingen,voorinschrijvingen,mailsjablonen"
ALLOWED_ORIGINS = "https://fmg-inschrijfplatform-test.freinetmiddenschool-automatisatie.workers.dev"
PUBLIC_APP_URL = "https://fmg-inschrijfplatform-test.freinetmiddenschool-automatisatie.workers.dev"
HOOFDADMIN_EMAIL = "freinetmiddenschool.automatisatie@onderwijs.gent.be"
# Geen echte mails vanuit test: enkel loggen.
MAIL_PROVIDER = "log"

